name: CI

# Pull-request gate. Nothing runs on a plain push; images are published by release.yaml.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/python-ci.yaml@cfa9265dd493260f1bf67b77d6cc396356c132d6 # v2 test

  image:
    needs: [python]
    permissions:
      contents: read
      packages: write
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/docker-build.yaml@cfa9265dd493260f1bf67b77d6cc396356c132d6 # v2 test
    with:
      trivyignores: .trivyignore

  workflows:
    permissions:
      contents: read
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/workflow-lint.yaml@cfa9265dd493260f1bf67b77d6cc396356c132d6 # v2 test
